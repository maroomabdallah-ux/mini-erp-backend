name: Backend CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mini_erp_test
          POSTGRES_USER: mini_erp
          POSTGRES_PASSWORD: test-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mini_erp -d mini_erp_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://mini_erp:test-only-password@localhost:5432/mini_erp_test
      JWT_SECRET: ci-only-secret-that-is-longer-than-thirty-two-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - run: ruff check app tests
      - run: mypy app
      - run: pytest --cov=app --cov-report=term-missing --cov-fail-under=70
